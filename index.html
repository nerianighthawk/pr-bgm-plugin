<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BGM Finder</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header class="heading">
        <div>
          <h1>BGM Finder</h1>
          <p>タグを組み合わせてBGMを検索</p>
        </div>
        <button id="add-tracks" class="primary-button" type="button">音源を追加</button>
      </header>

      <label class="search-label" for="tag-search">タグ検索（スペース区切りでAND検索）</label>
      <input
        id="tag-search"
        class="search-input"
        type="search"
        placeholder="例: 明るい 日常 一軍"
        autocomplete="off"
      >

      <div class="list-heading">
        <h2>音源ライブラリ</h2>
        <span id="result-count" aria-live="polite">0曲</span>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <ul id="track-list" class="track-list"></ul>

      <section class="player-section" aria-label="音源プレビュー">
        <p id="now-playing" class="now-playing">プレビューする音源を選択してください</p>
        <audio id="audio-player" controls></audio>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
