name: Build UXP Plugin

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build verification ZIP
        id: package
        run: |
          version="$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')"
          python3 scripts/build_release.py "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload UXP build artifact
        uses: actions/upload-artifact@v7
        with:
          name: uxp-plugin-build
          path: dist/bgm-finder-v${{ steps.package.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7